      properties:
        paused: {type: boolean}
        aiEnabled: {type: boolean}
        provider: {type: string}
        dailyLimit: {type: integer}
        dailyUsed: {type: integer}
        timezone: {type: string}
        costNote: {type: string}
        retentionNote: {type: string}
        narrationNote: {type: string}
    VideoSettingsInput:
      type: object
      required: [paused, budgetUsd]
