openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: SOLID AI REMIX — fondasi internal tanpa generasi video.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /studio/session:
    get:
      operationId: getStudioSession
      responses:
        "200":
          description: Studio gate status only, no member or asset data
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioSession"}
    post:
      operationId: enterStudio
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StudioPasswordInput"}
      responses:
        "200":
          description: Set a secure HttpOnly shared studio cookie
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioSession"}
    delete:
      operationId: leaveStudio
      responses:
        "200":
          description: Clear studio cookie
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioOk"}
  /studio/folders:
    get:
      operationId: listStudioFolders
      responses:
        "200":
          description: Explicitly shared folders; studio cookie required
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/StudioFolder"}}
    post:
      operationId: createStudioFolder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StudioFolderInput"}
      responses:
        "200":
          description: New directory member, not a Clerk account
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioFolder"}
  /studio/share:
    post:
      operationId: shareStudioFolder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StudioShareInput"}
      responses:
        "200":
          description: Owner/admin explicitly shares an existing folder without copying assets
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioFolder"}
  /studio/folders/{folderId}/checks/{id}:
    parameters:
      - {name: folderId, in: path, required: true, schema: {type: string}}
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getStudioSelfCheck
      responses:
        "200":
          description: Creator self-check, bound to current output and input revisions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioSelfCheck"}
    post:
      operationId: saveStudioSelfCheck
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StudioSelfCheckInput"}
      responses:
        "200":
          description: Record self-check without granting independent approval or charging a job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioSelfCheck"}
  /operations/report:
    get:
      operationId: getOperationsReport
      parameters:
        - {in: query, name: from, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
        - {in: query, name: to, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
        - {in: query, name: userId, schema: {type: string}}
        - {in: query, name: mode, schema: {type: string, enum: [HEMAT, AI]}}
        - {in: query, name: provider, schema: {type: string, maxLength: 120}}
      responses:
        "200":
          description: Filtered operational report, production separated from simulations
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsReport"}
  /operations/export:
    get:
      operationId: exportOperationsReport
      parameters:
        - {in: query, name: from, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
        - {in: query, name: to, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
        - {in: query, name: userId, schema: {type: string}}
        - {in: query, name: mode, schema: {type: string, enum: [HEMAT, AI]}}
        - {in: query, name: provider, schema: {type: string, maxLength: 120}}
      responses:
        "200": {description: Authorized CSV with formula injection protection}
  /operations/settings:
    get:
      operationId: getOperationsSettings
      responses:
        "200":
          description: Admin operational settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsSettings"}
    patch:
      operationId: updateOperationsSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OperationsSettingsInput"}
      responses:
        "200":
          description: Saved settings, no paid activation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsSettings"}
  /operations/providers:
    get:
      operationId: getProviderControls
      responses:
        "200":
          description: Super admin provider information
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ProviderControl"}}
    patch:
      operationId: updateProviderControls
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderControlInput"}
      responses:
        "200":
          description: Local switch saved, AI remains disabled
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ProviderControl"}}
  /operations/retention:
    get:
      operationId: getRetentionPreview
      responses:
        "200":
          description: Retention preview, no deletion
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RetentionPreview"}
    post:
      operationId: approveRetentionPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RetentionApprovalInput"}
      responses:
        "200":
          description: Explicit owner policy approval
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RetentionPreview"}
  /operations/audit:
    get:
      operationId: getOperationsAudit
      responses:
        "200":
          description: Admin only immutable activity evidence
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/OperationsAudit"}}
  /operations/sources:
    get:
      operationId: listComplianceSources
      responses:
        "200":
          description: Restricted source review
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ComplianceSource"}}
  /operations/sources/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    patch:
      operationId: reviewComplianceSource
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SourcePolicyInput"}
      responses:
        "200":
          description: Explicit single source decision, not automatic claim approval
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ComplianceSource"}
  /facts:
    get:
      operationId: listPublicFacts
      responses:
        "200":
          description: Facts visible to current role
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/PublicFact"}}
    post:
      operationId: createPublicFact
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PublicFactInput"}
      responses:
        "200":
          description: Draft fact for independent review
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicFact"}
  /facts/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: revisePublicFact
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PublicFactRevision"}
      responses:
        "200":
          description: Fact revision needs new independent approval
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicFact"}
  /facts/{id}/review:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: reviewPublicFact
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PublicFactReviewInput"}
      responses:
        "200":
          description: Independent review or revocation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicFact"}
  /creative/concepts/{id}/versions:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    get:
      operationId: getConceptVersions
      responses:
        "200":
          description: Retained version snapshots with current permissions
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ConceptVersionEvidence"}}
  /video/jobs/{id}/review:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getFinalVideoReview
      responses:
        "200":
          description: Bound final review evidence and limited references
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FinalVideoEvidence"}
    post:
      operationId: transitionFinalVideoReview
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FinalVideoReviewInput"}
      responses:
        "200":
          description: Final video review transition
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FinalVideoEvidence"}
  /video/jobs/{id}/reference:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getVideoReviewReference
      responses:
        "200": {description: "Character photo only for owner, admin or assigned reviewer"}
  /video/config:
    get:
      operationId: getVideoConfig
      responses:
        "200":
          description: Video capabilities and daily usage
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoConfig"}
  /video/jobs:
    get:
      operationId: listVideoJobs
      responses:
        "200":
          description: Authorized jobs
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/VideoJob"}}
    post:
      operationId: createVideoJob
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VideoJobInput"}
      responses:
        "200":
          description: Persisted or idempotently reused job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoJob"}
  /video/jobs/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getVideoJob
      responses:
        "200":
          description: Authorized job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoJob"}
    delete:
      operationId: deleteVideoResult
      responses:
        "200":
          description: Result removed, audit retained
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Success"}
  /video/jobs/{id}/cancel:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: cancelVideoJob
      responses:
        "200":
          description: Cancelled before completion
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoJob"}
  /video/jobs/{id}/file:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getVideoFile
      responses:
        "200": {description: Private MP4 bytes with Range support}
        "206": {description: Private MP4 byte range}
  /video/admin:
    get:
      operationId: getVideoUsage
      responses:
        "200":
          description: Admin usage and settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoUsage"}
    patch:
      operationId: updateVideoSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VideoSettingsInput"}
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoUsage"}
  /creative/library:
    get:
      operationId: getCreativeLibrary
      responses:
        "200":
          description: Kategori dan template sesuai role
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeLibrary"}
  /creative/categories:
    post:
      operationId: createCreativeCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeCategoryInput"}
      responses:
        "200":
          description: Kategori tersimpan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeCategory"}
  /creative/categories/{id}:
    put:
      operationId: updateCreativeCategory
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeCategoryUpdate"}
      responses:
        "200":
          description: Kategori diperbarui dengan versi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeCategory"}
  /creative/templates:
    post:
      operationId: createCreativeTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeTemplateInput"}
      responses:
        "200":
          description: Template tersimpan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeTemplate"}
  /creative/templates/{id}:
    put:
      operationId: updateCreativeTemplate
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeTemplateUpdate"}
      responses:
        "200":
          description: Template diperbarui dengan versi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeTemplate"}
  /creative/concepts:
    get:
      operationId: listCreativeConcepts
      responses:
        "200":
          description: Konsep sesuai izin termasuk metadata dan prompt
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CreativeConcept"}
    post:
      operationId: createCreativeConcept
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeConceptInput"}
      responses:
        "200":
          description: Draft tersimpan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeConcept"}
  /creative/preview:
    post:
      operationId: previewCreativePrompt
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeConceptInput"}
      responses:
        "200":
          description: Prompt deterministik tanpa generation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativePreview"}
  /creative/concepts/{id}:
    get:
      operationId: getCreativeConcept
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Konsep dan status kedaluwarsa
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeConcept"}
    put:
      operationId: updateCreativeConcept
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeConceptUpdate"}
      responses:
        "200":
          description: Versi baru selalu Draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeConcept"}
    delete:
      operationId: deleteCreativeConcept
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConceptVersionInput"}
      responses:
        "200":
          description: Konsep dan bahan dihapus
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Success"}
  /creative/concepts/{id}/status:
    post:
      operationId: transitionCreativeConcept
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeStatusInput"}
      responses:
        "200":
          description: Status berubah dengan audit review
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeConcept"}
  /creative/concepts/{id}/uploads:
    post:
      operationId: requestConceptUpload
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConceptUploadInput"}
      responses:
        "200":
          description: Reservasi kuota unggah staging privat
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadTicket"}
  /creative/concepts/{id}/uploads/{uploadId}:
    post:
      operationId: finalizeConceptUpload
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: uploadId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConceptVersionInput"}
      responses:
        "200":
          description: Isi diverifikasi lalu disalin ke objek final immutable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeConcept"}
    delete:
      operationId: deleteConceptAttachment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: uploadId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConceptVersionInput"}
      responses:
        "200":
          description: Bahan dihapus dan konsep kembali Draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeConcept"}
  /creative/concepts/{id}/attachments/{uploadId}:
    get:
      operationId: getConceptAttachment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: uploadId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Bahan privat, bukan foto karakter
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /creative/generate:
    post:
      operationId: generateCreativeVideo
      responses:
        "403":
          description: Generation selalu diblokir Tahap B
  /app-info:
    get:
      operationId: getAppInfo
      responses:
        "200":
          description: Informasi publik tanpa data perusahaan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInfo"
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Keanggotaan sesi saat ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /overview:
    get:
      operationId: getOverview
      responses:
        "200":
          description: Ringkasan nyata, bukan data demo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /character:
    get:
      operationId: getCharacter
      responses:
        "200":
          description: Satu karakter milik pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterResult"
    put:
      operationId: saveCharacter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "200":
          description: Foto diverifikasi dan karakter disimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
    delete:
      operationId: deleteCharacter
      responses:
        "200":
          description: Karakter dan foto privat dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
  /character/uploads:
    post:
      operationId: requestCharacterUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "200":
          description: Unggah langsung ke penyimpanan privat, kemudian saveCharacter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTicket"
  /character/voice:
    get:
      operationId: getCharacterVoice
      responses:
        "200":
          description: Optional private sample, never an enabled clone
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CharacterVoice"}
    put:
      operationId: saveCharacterVoice
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VoiceSampleInput"}
      responses:
        "200":
          description: Validated sample saved with explicit voice permission
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CharacterVoice"}
    delete:
      operationId: deleteCharacterVoice
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VoiceVersionInput"}
      responses:
        "200":
          description: Sample access revoked; cleanup retries independently
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CharacterVoice"}
  /character/voice/uploads:
    post:
      operationId: requestVoiceSampleUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VoiceUploadInput"}
      responses:
        "200":
          description: Private staging ticket bound to character and expected sample version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadTicket"}
  /character/voice/sample:
    get:
      operationId: getVoiceSample
      responses:
        "200": {description: "Authorized private WAV bytes, never a public object URL"}
  /character/photo:
    get:
      operationId: getCharacterPhoto
      responses:
        "200":
          description: Foto hanya untuk pemilik yang aktif
          content:
            image/jpeg:
              schema: {type: string, format: binary}
  /knowledge:
    get:
      operationId: listKnowledge
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: segment, in: query, schema: {type: string, enum: [ALL, COMPANY, MIKRO, MINI, REGULAR]}}
        - {name: mode, in: query, schema: {type: string, enum: [PUBLIC, INTERNAL]}}
      responses:
        "200":
          description: Hanya sumber sesuai akses dan mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeList"
  /knowledge/{id}:
    get:
      operationId: getKnowledgeSource
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Isi sumber dengan sumber asli dan peringatan validasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDetail"
  /activity:
    get:
      operationId: getActivity
      responses:
        "200":
          description: Aktivitas pengguna, admin melihat aktivitas tim
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Activity"}
  /team:
    get:
      operationId: listTeam
      responses:
        "200":
          description: Admin dan Super Admin; tidak ada batas sepuluh anggota aktif
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Member"}
  /team/{id}:
    patch:
      operationId: updateTeamMember
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Keanggotaan diperbarui dan diaudit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    StudioOk:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
    StudioSession:
      type: object
      required: [configured, authenticated]
      properties:
        configured: {type: boolean}
        authenticated: {type: boolean}
    StudioPasswordInput:
      type: object
      required: [password]
      properties:
        password: {type: string, minLength: 1, maxLength: 256}
    StudioFolderInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
    StudioShareInput:
      type: object
      required: [memberId, consent]
      properties:
        memberId: {type: string, minLength: 1}
        consent: {type: boolean}
    StudioFolder:
      type: object
      required: [id, name, memberId, characterName, photoUrl, dailyUsed, dailyLimit]
      properties:
        id: {type: string}
        memberId: {type: string}
        name: {type: string}
        characterName: {type: [string, "null"]}
        photoUrl: {type: [string, "null"]}
        dailyUsed: {type: integer}
        dailyLimit: {type: integer}
    StudioSelfCheckInput:
      type: object
      required: [confirmed, conceptVersion]
      properties:
        confirmed: {type: boolean}
        conceptVersion: {type: integer, minimum: 1}
    StudioSelfCheck:
      type: object
      required: [checked, stale, checkedAt]
      properties:
        checked: {type: boolean}
        stale: {type: boolean}
        checkedAt: {type: [string, "null"]}
    OperationsSettingsInput:
      type: object
      required: [paused, dailyLimit, budgetUsd, dailyBudgetUsd, userBudgetUsd, warningPercent, retentionDays]
      properties:
        paused: {type: boolean}
        dailyLimit: {type: integer, minimum: 1, maximum: 3}
        budgetUsd: {type: [number, "null"], minimum: 0, maximum: 10000}
        dailyBudgetUsd: {type: [number, "null"], minimum: 0, maximum: 10000}
        userBudgetUsd: {type: [number, "null"], minimum: 0, maximum: 10000}
        warningPercent: {type: integer, minimum: 1, maximum: 100}
        retentionDays: {type: [integer, "null"], minimum: 1, maximum: 3650}
    OperationsSettings:
      allOf:
        - {$ref: "#/components/schemas/OperationsSettingsInput"}
        - type: object
          required: [retentionVersion, retentionApproved, localEnabled, costNote]
          properties:
            retentionVersion: {type: integer}
            retentionApproved: {type: boolean}
            localEnabled: {type: boolean}
            costNote: {type: string}
    ProviderControlInput:
      type: object
      required: [localEnabled, reason]
      properties:
        localEnabled: {type: boolean}
        reason: {type: string, minLength: 10, maxLength: 500}
    ProviderControl:
      type: object
      required: [id, name, model, enabled, simulation, connection, capabilities, price, priceSource, checkedAt, reason]
      properties:
        id: {type: string}
        name: {type: string}
        model: {type: string}
        enabled: {type: boolean}
        simulation: {type: boolean}
        connection: {type: string}
        capabilities: {type: string}
        price: {type: string}
        priceSource: {type: string}
        checkedAt: {type: [string, "null"]}
        reason: {type: string}
    OperationsAudit:
      type: object
      required: [id, userId, action, description, objectId, result, before, after, createdAt]
      properties:
        id: {type: string}
        userId: {type: string}
        action: {type: string}
        description: {type: string}
        objectId: {type: [string, "null"]}
        result: {type: string}
        before: {type: [string, "null"]}
        after: {type: [string, "null"]}
        createdAt: {type: string}
    CostRecord:
      type: object
      required: [currency, model, source, estimatedUsd, actualUsd, providerUsd, renderUsd, ttsUsd, retryUsd, reservedUsd, retries, legacy]
      properties:
        currency: {type: string}
        model: {type: [string, "null"]}
        source: {type: string}
        estimatedUsd: {type: [number, "null"]}
        actualUsd: {type: [number, "null"]}
        providerUsd: {type: [number, "null"]}
        renderUsd: {type: [number, "null"]}
        ttsUsd: {type: [number, "null"]}
        retryUsd: {type: [number, "null"]}
        reservedUsd: {type: number}
        retries: {type: integer}
        legacy: {type: boolean}
    OperationsGroup:
      type: object
      required: [id, name, jobs, successful, failed, retries, actualUsd, knownSubtotalUsd, unknownCosts, estimatedPendingUsd, approved, rejected, waiting]
      properties:
        id: {type: string}
        name: {type: string}
        jobs: {type: integer}
        successful: {type: integer}
        failed: {type: integer}
        retries: {type: integer}
        actualUsd: {type: [number, "null"]}
        knownSubtotalUsd: {type: number}
        unknownCosts: {type: integer}
        estimatedPendingUsd: {type: [number, "null"]}
        approved: {type: integer}
        rejected: {type: integer}
        waiting: {type: integer}
        optimization: {$ref: "#/components/schemas/OptimizationMetrics"}
    OptimizationMetrics:
      type: object
      required: [approvalPercent, failurePercent, retryPercent, actualPerSuccessfulUsd, actualPerPublishableUsd, averageQueueMs, averageRenderMs, averageTotalMs, timedJobs, measuredBytes, technicalPass, technicalFail, untested, characterConsistency]
      properties:
        approvalPercent: {type: [number, "null"]}
        failurePercent: {type: [number, "null"]}
        retryPercent: {type: [number, "null"]}
        actualPerSuccessfulUsd: {type: [number, "null"]}
        actualPerPublishableUsd: {type: [number, "null"]}
        averageQueueMs: {type: [number, "null"]}
        averageRenderMs: {type: [number, "null"]}
        averageTotalMs: {type: [number, "null"]}
        timedJobs: {type: integer}
        measuredBytes: {type: integer}
        technicalPass: {type: integer}
        technicalFail: {type: integer}
        untested: {type: integer}
        characterConsistency: {type: string}
    VideoQualityCheck:
      type: object
      required: [id, status, detail]
      properties:
        id: {type: string}
        status: {type: string, enum: [PASS, WARNING, FAIL, MANUAL_REVIEW_REQUIRED]}
        detail: {type: string}
    VideoDiagnostics:
      type: object
      required: [rendererVersion, queueMs, materialMs, renderMs, validationMs, storageMs, totalMs, bytes, quality]
      properties:
        rendererVersion: {type: string}
        queueMs: {type: [number, "null"]}
        materialMs: {type: [number, "null"]}
        renderMs: {type: [number, "null"]}
        validationMs: {type: [number, "null"]}
        storageMs: {type: [number, "null"]}
        totalMs: {type: [number, "null"]}
        bytes: {type: [integer, "null"]}
        quality: {type: array, items: {$ref: "#/components/schemas/VideoQualityCheck"}}
    OperationsReport:
      type: object
      required: [from, to, users, modes, providers, jobs, summary, activeMembers, pendingMembers, characters, concepts, approvedConcepts, rejectedConcepts, waitingConcepts, processing, simulations, settings, warnings]
      properties:
        from: {type: string}
        to: {type: string}
        users: {type: array, items: {$ref: "#/components/schemas/OperationsGroup"}}
        modes: {type: array, items: {$ref: "#/components/schemas/OperationsGroup"}}
        providers: {type: array, items: {$ref: "#/components/schemas/OperationsGroup"}}
        jobs: {type: array, items: {$ref: "#/components/schemas/VideoJob"}}
        summary: {$ref: "#/components/schemas/OperationsGroup"}
        activeMembers: {type: integer}
        pendingMembers: {type: integer}
        characters: {type: integer}
        concepts: {type: integer}
        approvedConcepts: {type: integer}
        rejectedConcepts: {type: integer}
        waitingConcepts: {type: integer}
        processing: {type: integer}
        simulations: {type: integer}
        settings: {$ref: "#/components/schemas/OperationsSettings"}
        warnings: {type: array, items: {type: string}}
    RetentionApprovalInput:
      type: object
      required: [version, confirmed, note]
      properties:
        version: {type: integer}
        confirmed: {type: boolean}
        note: {type: string, minLength: 10, maxLength: 1000}
    RetentionPreview:
      type: object
      required: [settings, warning, candidates]
      properties:
        settings: {$ref: "#/components/schemas/OperationsSettings"}
        warning: {type: string}
        candidates: {type: array, items: {$ref: "#/components/schemas/VideoJob"}}
    ComplianceSource:
      type: object
      required: [id, title, segment, content, version, sha256, revision, access, validation, warnings, active]
      properties:
        id: {type: string}
        title: {type: string}
        segment: {type: string}
        content: {type: string}
        version: {type: string}
        sha256: {type: string}
        revision: {type: string}
        access: {type: string}
        validation: {type: string}
        warnings: {type: array, items: {type: string}}
        active: {type: boolean}
    SourcePolicyInput:
      type: object
      required: [revision, validation, access, clearWarnings, note]
      properties:
        revision: {type: string}
        validation: {type: string, enum: [NEEDS_REVIEW, APPROVED, REJECTED]}
        access: {type: string, enum: [INTERNAL_GENERAL, INTERNAL_RESTRICTED, APPROVED_FOR_PUBLIC_CONTENT]}
        clearWarnings: {type: boolean}
        note: {type: string, minLength: 10, maxLength: 1500}
    PublicFactInput:
      type: object
      required: [sourceId, claim, quote]
      properties:
        sourceId: {type: string}
        claim: {type: string, minLength: 10, maxLength: 1200}
        quote: {type: string, minLength: 10, maxLength: 2000}
    PublicFactRevision:
      allOf:
        - {$ref: "#/components/schemas/PublicFactInput"}
        - type: object
          required: [version]
          properties:
            version: {type: integer, minimum: 1}
    PublicFactReviewInput:
      type: object
      required: [version, status, note]
      properties:
        version: {type: integer}
        status: {type: string, enum: [APPROVED, REJECTED, REVOKED]}
        note: {type: string, minLength: 10, maxLength: 1500}
    PublicFact:
      allOf:
        - {$ref: "#/components/schemas/PublicFactInput"}
        - type: object
          required: [id, version, status, segment, creatorId, reviewerId, note, reviewedAt, sourceRevision, usable]
          properties:
            id: {type: string}
            version: {type: integer}
            status: {type: string}
            segment: {type: string}
            creatorId: {type: string}
            reviewerId: {type: [string, "null"]}
            note: {type: string}
            reviewedAt: {type: [string, "null"]}
            sourceRevision: {type: string}
            usable: {type: boolean}
    ConceptVersionEvidence:
      type: object
      required: [version, status, capturedAt, evidence, limited]
      properties:
        version: {type: integer}
        status: {type: string}
        capturedAt: {type: string}
        evidence: {type: string}
        limited: {type: boolean}
    FinalVideoReviewInput:
      type: object
      required: [version, action, note, checklist]
      properties:
        version: {type: integer, minimum: 0}
        action: {type: string, enum: [SUBMIT, CLAIM, APPROVE, REJECT, REVISE]}
        note: {type: string, maxLength: 1500}
        checklist: {type: array, maxItems: 10, items: {type: string, enum: [IDENTITY, VISUAL, LOGO, NUMBERS, PRODUCT, SUBTITLE, AUDIO, CTA, DISCLAIMER, CONCEPT]}}
    FinalVideoEvidence:
      type: object
      required: [job, stale, reasons, referenceUrl, conceptUrl, history]
      properties:
        job: {$ref: "#/components/schemas/VideoJob"}
        stale: {type: boolean}
        reasons: {type: array, items: {type: string}}
        referenceUrl: {type: [string, "null"]}
        conceptUrl: {type: [string, "null"]}
        history: {type: array, items: {$ref: "#/components/schemas/ConceptVersionEvidence"}}
    VideoCue:
      type: object
      required: [start, end]
      properties:
        start: {type: number, minimum: 0, maximum: 15}
        end: {type: number, minimum: 0, maximum: 15}
    VideoRenderOptions:
      type: object
      required: [motion, logoPosition, cues]
      properties:
        referencePolicy:
          type: string
          enum: [STUDIO_REFERENCE_ONLY_V1]
          readOnly: true
          description: Server-bound optional KB policy for new shared studio jobs only. Omission preserves historical checks.
        studioFolderId:
          type: string
          readOnly: true
          description: Authenticated folder persisted by the server for the reference policy; caller values are discarded.
        brandingMode:
          type: string
          enum: [LOGO, NONE]
          description: Omission preserves legacy mandatory-logo behavior. NONE is allowed only for shared studio jobs.
        legacyLogoAttachmentIds:
          type: array
          maxItems: 3
          readOnly: true
          items: {type: string}
          description: Server-recorded old logo assets excluded from scenes in a new unbranded studio job.
        postTextMode:
          type: string
          enum: [IN_VIDEO, MANUAL_AFTER_DOWNLOAD]
          description: Omission preserves existing in-video text behavior. Manual text is allowed only for explicitly shared studio folders.
        motion: {type: string, enum: [ZOOM_IN, ZOOM_OUT, PAN_LEFT, PAN_RIGHT]}
        logoPosition: {type: string, enum: [TOP_LEFT, TOP_RIGHT]}
        logoAttachmentId: {type: string, minLength: 1}
        cues: {type: array, minItems: 1, maxItems: 12, items: {$ref: "#/components/schemas/VideoCue"}}
    VideoJobInput:
      type: object
      required: [conceptId, version, mode, requestKey, options, confirmed]
      properties:
        conceptId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        mode: {type: string, enum: [HEMAT, AI]}
        requestKey: {type: string, format: uuid}
        options: {$ref: "#/components/schemas/VideoRenderOptions"}
        confirmed: {type: boolean}
    VideoJob:
      type: object
      required: [id, conceptId, conceptVersion, characterId, title, ownerId, status, mode, provider, simulation, durationSeconds, width, height, attempts, createdAt, updatedAt, submittedAt, error, estimatedCostUsd, actualCostUsd, providerCostUsd, resultUrl, rawResultUrl, deleted, options]
      properties:
        diagnostics:
          oneOf:
            - {$ref: "#/components/schemas/VideoDiagnostics"}
            - {type: "null"}
        publicationStatus: {type: string}
        retentionNoticeAt: {type: [string, "null"]}
        retentionNoticeVersion: {type: [integer, "null"]}
        publicationVersion: {type: integer}
        reviewerId: {type: [string, "null"]}
        publicationStale: {type: boolean}
        publicationUrl: {type: [string, "null"]}
        cost: {$ref: "#/components/schemas/CostRecord"}
        id: {type: string}
        conceptId: {type: [string, "null"]}
        conceptVersion: {type: integer}
        characterId: {type: string}
        title: {type: string}
        ownerId: {type: string}
        status: {type: string, enum: [DRAFT, READY, QUEUED, SUBMITTED, PROCESSING, COMPLETED, FAILED, CANCELLED, UNKNOWN, SIMULATED]}
        mode: {type: string, enum: [HEMAT, AI]}
        provider: {type: string}
        simulation: {type: boolean}
        durationSeconds: {type: integer}
        width: {type: integer}
        height: {type: integer}
        attempts: {type: integer}
        createdAt: {type: string}
        updatedAt: {type: string}
        submittedAt: {type: [string, "null"]}
        error: {type: [string, "null"]}
        estimatedCostUsd: {type: [number, "null"]}
        actualCostUsd: {type: [number, "null"]}
        providerCostUsd: {type: [number, "null"]}
        resultUrl: {type: [string, "null"]}
        rawResultUrl: {type: [string, "null"]}
        deleted: {type: boolean}
        cleanupPending: {type: boolean, description: File access revoked but storage cleanup still needs retry}
        options: {$ref: "#/components/schemas/VideoRenderOptions"}
        voiceBinding:
          description: "Immutable voice selection metadata only; null for older jobs. Never a narration source."
          oneOf:
            - {$ref: "#/components/schemas/VoiceJobBinding"}
            - {type: "null"}
    VoiceJobBinding:
      type: object
      required: [characterId, sampleId, sampleVersion, provider, providerProfileId, providerVoiceVersion, synthesisEnabled]
      properties:
        characterId: {type: string}
        sampleId: {type: ["string", "null"]}
        sampleVersion: {type: integer}
        provider: {type: ["string", "null"]}
        providerProfileId: {type: ["string", "null"]}
        providerVoiceVersion: {type: ["string", "null"]}
        synthesisEnabled: {type: boolean, enum: [false]}
    VideoConfig:
      type: object
