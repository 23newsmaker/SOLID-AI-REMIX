    AppInfo:
      type: object
      required: [name, stage, generationEnabled, llmEnabled, dailyLimit, maxMembers]
      properties:
        name: {type: string}
        stage: {type: string}
        generationEnabled: {type: boolean}
        llmEnabled: {type: boolean}
        dailyLimit: {type: integer}
        maxMembers: {type: [integer, "null"], description: "Null berarti tidak ada batas jumlah anggota yang ditetapkan aplikasi."}
    Role:
      type: string
      enum: [SUPER_ADMIN, ADMIN, CREATOR, REVIEWER_COMPLIANCE, VIEWER]
    Member:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        status: {type: string, enum: [PENDING, ACTIVE, SUSPENDED]}
        createdAt: {type: string}
    MemberUpdate:
      type: object
      required: [role, status]
      properties:
        role: {$ref: "#/components/schemas/Role"}
        status: {type: string, enum: [PENDING, ACTIVE, SUSPENDED]}
    Character:
      type: object
      required: [id, name, photoUrl, updatedAt, consentAt]
      properties:
        id: {type: string}
        name: {type: string}
        photoUrl: {type: string}
        updatedAt: {type: string}
        consentAt: {type: string}
    CharacterVoice:
      type: object
      required: [characterId, version, status, sampleUrl, durationSeconds, updatedAt, providerEnabled]
      properties:
        characterId: {type: ["string", "null"]}
        version: {type: integer}
        status: {type: string, enum: [NO_SAMPLE, SAMPLE_SAVED_AUTOMATION_DISABLED]}
        sampleUrl: {type: ["string", "null"]}
        durationSeconds: {type: ["number", "null"]}
        updatedAt: {type: ["string", "null"]}
        providerEnabled: {type: boolean, enum: [false]}
    VoiceVersionInput:
      type: object
      required: [characterId, expectedVersion]
      properties:
        characterId: {type: string, minLength: 1}
        expectedVersion: {type: integer, minimum: 0}
    VoiceUploadInput:
      allOf:
        - {$ref: "#/components/schemas/VoiceVersionInput"}
        - type: object
          required: [size, contentType]
          properties:
            size: {type: integer, minimum: 1, maximum: 10485760}
            contentType: {type: string, enum: [audio/webm, audio/ogg, audio/mp4, audio/x-m4a, audio/mpeg, audio/wav, audio/x-wav, audio/aac]}
    VoiceSampleInput:
      allOf:
        - {$ref: "#/components/schemas/VoiceVersionInput"}
        - type: object
          required: [uploadId, consent]
          properties:
            uploadId: {type: string, minLength: 1}
            consent: {type: boolean, enum: [true]}
    CharacterResult:
      type: object
      required: [character]
      properties:
        character:
          oneOf:
            - {$ref: "#/components/schemas/Character"}
            - {type: "null"}
    CharacterInput:
      type: object
      required: [name, uploadId, consent]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        uploadId: {type: string}
        consent: {type: boolean}
    UploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: {type: string, maxLength: 200}
        size: {type: integer, minimum: 1, maximum: 5242880}
        contentType: {type: string, enum: [image/jpeg, image/png, image/webp]}
    UploadTicket:
      type: object
      required: [uploadId, uploadURL]
      properties:
        uploadId: {type: string}
        uploadURL: {type: string}
    Source:
      type: object
      required: [id, title, sourceId, segment, category, validation, access, version, fileName, warnings]
      properties:
        id: {type: string}
        title: {type: string}
        sourceId: {type: string}
        segment: {type: string}
        category: {type: string}
        validation: {type: string}
        access: {type: string}
        version: {type: string}
        fileName: {type: string}
        warnings:
          type: array
          items: {type: string}
    KnowledgeList:
      type: object
      required: [items, total, publicApproved, notice]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Source"}
        total: {type: integer}
        publicApproved: {type: integer}
        notice: {type: string}
    KnowledgeDetail:
      type: object
      required: [source, content]
      properties:
        source: {$ref: "#/components/schemas/Source"}
        content: {type: string}
    Activity:
      type: object
      required: [id, action, description, createdAt]
      properties:
        id: {type: string}
        action: {type: string}
        description: {type: string}
        createdAt: {type: string}
    Overview:
      type: object
      required: [characterReady, sourceCount, approvedPublicCount, activeMembers, maxMembers, dailyLimit, dailyUsed, generationEnabled, llmEnabled, phase, nextStep]
      properties:
        characterReady: {type: boolean}
        sourceCount: {type: integer}
        approvedPublicCount: {type: integer}
        activeMembers: {type: integer}
        maxMembers: {type: [integer, "null"], description: "Null berarti tidak ada batas jumlah anggota yang ditetapkan aplikasi."}
        dailyLimit: {type: integer}
        dailyUsed: {type: integer}
        generationEnabled: {type: boolean}
        llmEnabled: {type: boolean}
        phase: {type: string}
        nextStep: {type: string}
    Success:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

