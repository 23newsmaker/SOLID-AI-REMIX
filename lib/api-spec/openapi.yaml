openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: SOLID AI REMIX — fondasi internal tanpa generasi video.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /video/config:
    get:
      operationId: getVideoConfig
      responses:
        "200":
          description: Video capabilities and daily usage
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoConfig"}
  /video/jobs:
    get:
      operationId: listVideoJobs
      responses:
        "200":
          description: Authorized jobs
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/VideoJob"}}
    post:
      operationId: createVideoJob
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VideoJobInput"}
      responses:
        "200":
          description: Persisted or idempotently reused job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoJob"}
  /video/jobs/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getVideoJob
      responses:
        "200":
          description: Authorized job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoJob"}
    delete:
      operationId: deleteVideoResult
      responses:
        "200":
          description: Result removed, audit retained
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Success"}
  /video/jobs/{id}/cancel:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: cancelVideoJob
      responses:
        "200":
          description: Cancelled before completion
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoJob"}
  /video/jobs/{id}/file:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getVideoFile
      responses:
        "200": {description: Private MP4 bytes with Range support}
        "206": {description: Private MP4 byte range}
  /video/admin:
    get:
      operationId: getVideoUsage
      responses:
        "200":
          description: Admin usage and settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoUsage"}
    patch:
      operationId: updateVideoSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VideoSettingsInput"}
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoUsage"}
  /creative/library:
    get:
      operationId: getCreativeLibrary
      responses:
        "200":
          description: Kategori dan template sesuai role
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeLibrary"}
  /creative/categories:
    post:
      operationId: createCreativeCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeCategoryInput"}
      responses:
        "200":
          description: Kategori tersimpan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeCategory"}
  /creative/categories/{id}:
    put:
      operationId: updateCreativeCategory
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeCategoryUpdate"}
      responses:
        "200":
          description: Kategori diperbarui dengan versi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeCategory"}
  /creative/templates:
    post:
      operationId: createCreativeTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeTemplateInput"}
      responses:
        "200":
          description: Template tersimpan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeTemplate"}
  /creative/templates/{id}:
    put:
      operationId: updateCreativeTemplate
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeTemplateUpdate"}
      responses:
        "200":
          description: Template diperbarui dengan versi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeTemplate"}
  /creative/concepts:
    get:
      operationId: listCreativeConcepts
      responses:
        "200":
          description: Konsep sesuai izin termasuk metadata dan prompt
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CreativeConcept"}
    post:
      operationId: createCreativeConcept
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeConceptInput"}
      responses:
        "200":
          description: Draft tersimpan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeConcept"}
  /creative/preview:
    post:
      operationId: previewCreativePrompt
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeConceptInput"}
      responses:
        "200":
          description: Prompt deterministik tanpa generation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativePreview"}
  /creative/concepts/{id}:
    get:
      operationId: getCreativeConcept
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Konsep dan status kedaluwarsa
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeConcept"}
    put:
      operationId: updateCreativeConcept
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeConceptUpdate"}
      responses:
        "200":
          description: Versi baru selalu Draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeConcept"}
    delete:
      operationId: deleteCreativeConcept
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConceptVersionInput"}
      responses:
        "200":
          description: Konsep dan bahan dihapus
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Success"}
  /creative/concepts/{id}/status:
    post:
      operationId: transitionCreativeConcept
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreativeStatusInput"}
      responses:
        "200":
          description: Status berubah dengan audit review
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeConcept"}
  /creative/concepts/{id}/uploads:
    post:
      operationId: requestConceptUpload
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConceptUploadInput"}
      responses:
        "200":
          description: Reservasi kuota unggah staging privat
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadTicket"}
  /creative/concepts/{id}/uploads/{uploadId}:
    post:
      operationId: finalizeConceptUpload
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: uploadId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConceptVersionInput"}
      responses:
        "200":
          description: Isi diverifikasi lalu disalin ke objek final immutable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeConcept"}
    delete:
      operationId: deleteConceptAttachment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: uploadId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConceptVersionInput"}
      responses:
        "200":
          description: Bahan dihapus dan konsep kembali Draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreativeConcept"}
  /creative/concepts/{id}/attachments/{uploadId}:
    get:
      operationId: getConceptAttachment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: uploadId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Bahan privat, bukan foto karakter
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /creative/generate:
    post:
      operationId: generateCreativeVideo
      responses:
        "403":
          description: Generation selalu diblokir Tahap B
  /app-info:
    get:
      operationId: getAppInfo
      responses:
        "200":
          description: Informasi publik tanpa data perusahaan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInfo"
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Keanggotaan sesi saat ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /overview:
    get:
      operationId: getOverview
      responses:
        "200":
          description: Ringkasan nyata, bukan data demo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /character:
    get:
      operationId: getCharacter
      responses:
        "200":
          description: Satu karakter milik pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterResult"
    put:
      operationId: saveCharacter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "200":
          description: Foto diverifikasi dan karakter disimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
    delete:
      operationId: deleteCharacter
      responses:
        "200":
          description: Karakter dan foto privat dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
  /character/uploads:
    post:
      operationId: requestCharacterUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "200":
          description: Unggah langsung ke penyimpanan privat, kemudian saveCharacter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTicket"
  /character/photo:
    get:
      operationId: getCharacterPhoto
      responses:
        "200":
          description: Foto hanya untuk pemilik yang aktif
          content:
            image/jpeg:
              schema: {type: string, format: binary}
  /knowledge:
    get:
      operationId: listKnowledge
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: segment, in: query, schema: {type: string, enum: [ALL, COMPANY, MIKRO, MINI, REGULAR]}}
        - {name: mode, in: query, schema: {type: string, enum: [PUBLIC, INTERNAL]}}
      responses:
        "200":
          description: Hanya sumber sesuai akses dan mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeList"
  /knowledge/{id}:
    get:
      operationId: getKnowledgeSource
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Isi sumber dengan sumber asli dan peringatan validasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDetail"
  /activity:
    get:
      operationId: getActivity
      responses:
        "200":
          description: Aktivitas pengguna, admin melihat aktivitas tim
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Activity"}
  /team:
    get:
      operationId: listTeam
      responses:
        "200":
          description: Hanya SUPER_ADMIN, maksimal sepuluh anggota aktif
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Member"}
  /team/{id}:
    patch:
      operationId: updateTeamMember
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Keanggotaan diperbarui dan diaudit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    VideoCue:
      type: object
      required: [start, end]
      properties:
        start: {type: number, minimum: 0, maximum: 15}
        end: {type: number, minimum: 0, maximum: 15}
    VideoRenderOptions:
      type: object
      required: [motion, logoPosition, logoAttachmentId, cues]
      properties:
        motion: {type: string, enum: [ZOOM_IN, ZOOM_OUT, PAN_LEFT, PAN_RIGHT]}
        logoPosition: {type: string, enum: [TOP_LEFT, TOP_RIGHT]}
        logoAttachmentId: {type: string, minLength: 1}
        cues: {type: array, minItems: 1, maxItems: 12, items: {$ref: "#/components/schemas/VideoCue"}}
    VideoJobInput:
      type: object
      required: [conceptId, version, mode, requestKey, options, confirmed]
      properties:
        conceptId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        mode: {type: string, enum: [HEMAT, AI]}
        requestKey: {type: string, format: uuid}
        options: {$ref: "#/components/schemas/VideoRenderOptions"}
        confirmed: {type: boolean}
    VideoJob:
      type: object
      required: [id, conceptId, conceptVersion, characterId, title, ownerId, status, mode, provider, simulation, durationSeconds, width, height, attempts, createdAt, updatedAt, submittedAt, error, estimatedCostUsd, actualCostUsd, providerCostUsd, resultUrl, rawResultUrl, deleted, options]
      properties:
        id: {type: string}
        conceptId: {type: [string, "null"]}
        conceptVersion: {type: integer}
        characterId: {type: string}
        title: {type: string}
        ownerId: {type: string}
        status: {type: string, enum: [DRAFT, READY, QUEUED, SUBMITTED, PROCESSING, COMPLETED, FAILED, CANCELLED, UNKNOWN, SIMULATED]}
        mode: {type: string, enum: [HEMAT, AI]}
        provider: {type: string}
        simulation: {type: boolean}
        durationSeconds: {type: integer}
        width: {type: integer}
        height: {type: integer}
        attempts: {type: integer}
        createdAt: {type: string}
        updatedAt: {type: string}
        submittedAt: {type: [string, "null"]}
        error: {type: [string, "null"]}
        estimatedCostUsd: {type: [number, "null"]}
        actualCostUsd: {type: [number, "null"]}
        providerCostUsd: {type: [number, "null"]}
        resultUrl: {type: [string, "null"]}
        rawResultUrl: {type: [string, "null"]}
        deleted: {type: boolean}
        options: {$ref: "#/components/schemas/VideoRenderOptions"}
    VideoConfig:
      type: object
      required: [paused, aiEnabled, provider, dailyLimit, dailyUsed, timezone, costNote, retentionNote, narrationNote]
      properties:
        paused: {type: boolean}
        aiEnabled: {type: boolean}
        provider: {type: string}
        dailyLimit: {type: integer}
        dailyUsed: {type: integer}
        timezone: {type: string}
        costNote: {type: string}
        retentionNote: {type: string}
        narrationNote: {type: string}
    VideoSettingsInput:
      type: object
      required: [paused, budgetUsd]
      properties:
        paused: {type: boolean}
        budgetUsd: {type: [number, "null"], minimum: 0, maximum: 10000}
    VideoUsageMember:
      type: object
      required: [userId, name, jobs, failures, retries, knownProviderUsd, unknownCosts]
      properties:
        userId: {type: string}
        name: {type: string}
        jobs: {type: integer}
        failures: {type: integer}
        retries: {type: integer}
        knownProviderUsd: {type: number}
        unknownCosts: {type: integer}
    VideoUsage:
      allOf:
        - {$ref: "#/components/schemas/VideoSettingsInput"}
        - type: object
          required: [month, knownProviderUsd, unknownCosts, members, costNote]
          properties:
            month: {type: string}
            knownProviderUsd: {type: number}
            unknownCosts: {type: integer}
            members: {type: array, items: {$ref: "#/components/schemas/VideoUsageMember"}}
            costNote: {type: string}
    CreativeSegment:
      type: string
      enum: [MIKRO, MINI, REGULAR, NONE]
    CreativeCategoryInput:
      type: object
      required: [name, active]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        active: {type: boolean}
    CreativeCategoryUpdate:
      allOf:
        - {$ref: "#/components/schemas/CreativeCategoryInput"}
        - type: object
          required: [version]
          properties:
            version: {type: integer, minimum: 1}
    CreativeCategory:
      allOf:
        - {$ref: "#/components/schemas/CreativeCategoryUpdate"}
        - type: object
          required: [id]
          properties:
            id: {type: string}
    CreativeTemplateInput:
      type: object
      required: [name, categoryId, segments, style, description, scenes, characterMotion, cameraMotion, visual, narration, cta, active]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        categoryId: {type: string, minLength: 1}
        segments:
          type: array
          minItems: 1
          maxItems: 4
          items: {$ref: "#/components/schemas/CreativeSegment"}
        style: {type: string, enum: [UGC, CINEMATIC]}
        description: {type: string, maxLength: 2000}
        scenes: {type: string, maxLength: 4000}
        characterMotion: {type: string, maxLength: 2000}
        cameraMotion: {type: string, maxLength: 2000}
        visual: {type: string, maxLength: 2000}
        narration: {type: string, maxLength: 4000}
        cta: {type: string, maxLength: 1000}
        active: {type: boolean}
    CreativeTemplateUpdate:
      allOf:
        - {$ref: "#/components/schemas/CreativeTemplateInput"}
        - type: object
          required: [version]
          properties:
            version: {type: integer, minimum: 1}
    CreativeTemplate:
      allOf:
        - {$ref: "#/components/schemas/CreativeTemplateUpdate"}
        - type: object
          required: [id]
          properties:
            id: {type: string}
    CreativeLibrary:
      type: object
      required: [categories, templates, maxConcepts, maxImages, maxImageBytes, maxVideos, maxVideoBytes, maxTotalBytes]
      properties:
        categories: {type: array, items: {$ref: "#/components/schemas/CreativeCategory"}}
        templates: {type: array, items: {$ref: "#/components/schemas/CreativeTemplate"}}
        maxConcepts: {type: integer}
        maxImages: {type: integer}
        maxImageBytes: {type: integer}
        maxVideos: {type: integer}
        maxVideoBytes: {type: integer}
        maxTotalBytes: {type: integer}
    CreativeConceptInput:
      type: object
      required: [title, characterId, categoryId, segments, style, mode, templateId, purpose, direction, scenes, characterMotion, cameraMotion, visual, narration, subtitle, cta, format, durationSeconds, sourceIds, publicMode, materialConsent]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        characterId: {type: string, minLength: 1}
        categoryId: {type: string, minLength: 1}
        segments:
          type: array
          minItems: 1
          maxItems: 3
          items: {$ref: "#/components/schemas/CreativeSegment"}
        style: {type: string, enum: [UGC, CINEMATIC]}
        mode: {type: string, enum: [HEMAT, AI]}
        templateId: {type: [string, "null"]}
        purpose: {type: string, maxLength: 2000}
        direction: {type: string, maxLength: 8000}
        scenes: {type: string, maxLength: 4000}
        characterMotion: {type: string, maxLength: 2000}
        cameraMotion: {type: string, maxLength: 2000}
        visual: {type: string, maxLength: 2000}
        narration: {type: string, maxLength: 4000}
        subtitle: {type: string, maxLength: 4000}
        cta: {type: string, maxLength: 1000}
        disclaimer: {type: string, maxLength: 220, default: ""}
        format: {type: string, enum: ["9:16", "16:9", "1:1"]}
        durationSeconds: {type: integer, minimum: 1, maximum: 120}
        sourceIds: {type: array, maxItems: 12, items: {type: string}}
        publicMode: {type: boolean}
        materialConsent: {type: boolean}
    CreativeConceptUpdate:
      allOf:
        - {$ref: "#/components/schemas/CreativeConceptInput"}
        - {$ref: "#/components/schemas/ConceptVersionInput"}
    ConceptVersionInput:
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
    CreativePreview:
      type: object
      required: [prompt, warnings, blockers]
      properties:
        prompt: {type: string}
        warnings: {type: array, items: {type: string}}
        blockers: {type: array, items: {type: string}}
    ConceptAttachment:
      type: object
      required: [id, name, contentType, size, url, ownerId, state]
      properties:
        id: {type: string}
        name: {type: string}
        contentType: {type: string}
        size: {type: integer}
        url: {type: string}
        ownerId: {type: string}
        state: {type: string, enum: [PENDING, READY]}
    CreativeReview:
      type: object
      required: [id, actorId, action, note, version, createdAt]
      properties:
        id: {type: string}
        actorId: {type: string}
        action: {type: string}
        note: {type: string}
        version: {type: integer}
        createdAt: {type: string}
    CreativeConcept:
      allOf:
        - {$ref: "#/components/schemas/CreativeConceptUpdate"}
        - {$ref: "#/components/schemas/CreativePreview"}
        - type: object
          required: [id, ownerId, ownerName, categoryName, templateName, characterName, status, stale, staleReasons, createdAt, updatedAt, attachments, reviews]
          properties:
            id: {type: string}
            ownerId: {type: string}
            ownerName: {type: string}
            categoryName: {type: string}
            templateName: {type: [string, "null"]}
            characterName: {type: string}
            status: {type: string, enum: [DRAFT, READY_FOR_REVIEW, APPROVED, REJECTED]}
            stale: {type: boolean}
            staleReasons: {type: array, items: {type: string}}
            createdAt: {type: string}
            updatedAt: {type: string}
            attachments: {type: array, items: {$ref: "#/components/schemas/ConceptAttachment"}}
            reviews: {type: array, items: {$ref: "#/components/schemas/CreativeReview"}}
    CreativeStatusInput:
      type: object
      required: [version, status, note]
      properties:
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [DRAFT, READY_FOR_REVIEW, APPROVED, REJECTED]}
        note: {type: string, maxLength: 2000}
    ConceptUploadInput:
      type: object
      required: [version, name, size, contentType]
      properties:
        version: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 200}
        size: {type: integer, minimum: 1, maximum: 20971520}
        contentType: {type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, audio/mpeg, audio/wav]}
    AppInfo:
      type: object
      required: [name, stage, generationEnabled, llmEnabled, dailyLimit, maxMembers]
      properties:
        name: {type: string}
        stage: {type: string}
        generationEnabled: {type: boolean}
        llmEnabled: {type: boolean}
        dailyLimit: {type: integer}
        maxMembers: {type: integer}
    Role:
      type: string
      enum: [SUPER_ADMIN, ADMIN, CREATOR, REVIEWER_COMPLIANCE, VIEWER]
    Member:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        status: {type: string, enum: [PENDING, ACTIVE, SUSPENDED]}
        createdAt: {type: string}
    MemberUpdate:
      type: object
      required: [role, status]
      properties:
        role: {$ref: "#/components/schemas/Role"}
        status: {type: string, enum: [PENDING, ACTIVE, SUSPENDED]}
    Character:
      type: object
      required: [id, name, photoUrl, updatedAt, consentAt]
      properties:
        id: {type: string}
        name: {type: string}
        photoUrl: {type: string}
        updatedAt: {type: string}
        consentAt: {type: string}
    CharacterResult:
      type: object
      required: [character]
      properties:
        character:
          oneOf:
            - {$ref: "#/components/schemas/Character"}
            - {type: "null"}
    CharacterInput:
      type: object
      required: [name, uploadId, consent]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        uploadId: {type: string}
        consent: {type: boolean}
    UploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: {type: string, maxLength: 200}
        size: {type: integer, minimum: 1, maximum: 5242880}
        contentType: {type: string, enum: [image/jpeg, image/png, image/webp]}
    UploadTicket:
      type: object
      required: [uploadId, uploadURL]
      properties:
        uploadId: {type: string}
        uploadURL: {type: string}
    Source:
      type: object
      required: [id, title, sourceId, segment, category, validation, access, version, fileName, warnings]
      properties:
        id: {type: string}
        title: {type: string}
        sourceId: {type: string}
        segment: {type: string}
        category: {type: string}
        validation: {type: string}
        access: {type: string}
        version: {type: string}
        fileName: {type: string}
        warnings:
          type: array
          items: {type: string}
    KnowledgeList:
      type: object
      required: [items, total, publicApproved, notice]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Source"}
        total: {type: integer}
        publicApproved: {type: integer}
        notice: {type: string}
    KnowledgeDetail:
      type: object
      required: [source, content]
      properties:
        source: {$ref: "#/components/schemas/Source"}
        content: {type: string}
    Activity:
      type: object
      required: [id, action, description, createdAt]
      properties:
        id: {type: string}
        action: {type: string}
        description: {type: string}
        createdAt: {type: string}
    Overview:
      type: object
      required: [characterReady, sourceCount, approvedPublicCount, activeMembers, maxMembers, dailyLimit, dailyUsed, generationEnabled, llmEnabled, phase, nextStep]
      properties:
        characterReady: {type: boolean}
        sourceCount: {type: integer}
        approvedPublicCount: {type: integer}
        activeMembers: {type: integer}
        maxMembers: {type: integer}
        dailyLimit: {type: integer}
        dailyUsed: {type: integer}
        generationEnabled: {type: boolean}
        llmEnabled: {type: boolean}
        phase: {type: string}
        nextStep: {type: string}
    Success:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

