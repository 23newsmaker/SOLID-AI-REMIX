        mode: {type: string, enum: [HEMAT, AI]}
        templateId: {type: [string, "null"]}
        purpose: {type: string, maxLength: 2000}
        direction: {type: string, maxLength: 8000}
        scenes: {type: string, maxLength: 4000}
        characterMotion: {type: string, maxLength: 2000}
        cameraMotion: {type: string, maxLength: 2000}
        visual: {type: string, maxLength: 2000}
        narration: {type: string, maxLength: 4000}
        subtitle: {type: string, maxLength: 4000}
        cta: {type: string, maxLength: 1000}
        disclaimer: {type: string, maxLength: 220, default: ""}
        format: {type: string, enum: ["9:16", "16:9", "1:1"]}
        durationSeconds: {type: integer, minimum: 1, maximum: 120}
        sourceIds: {type: array, maxItems: 12, items: {type: string}}
        publicMode: {type: boolean}
        materialConsent: {type: boolean}
    CreativeConceptUpdate:
